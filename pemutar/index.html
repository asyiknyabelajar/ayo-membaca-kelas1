<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayo Membaca! — Kelas 1 SD</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dceff1;color:#183f4b;font:16px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}#game{width:min(100%,1000px);aspect-ratio:4/3;background:#dbf3fb;box-shadow:0 12px 48px #173e4a26;border-radius:16px;overflow:hidden}ruffle-player{display:block;width:100%;height:100%}p{font-size:13px;margin:10px 0 0;text-align:center}button{border:0;border-radius:8px;background:#13788a;color:white;padding:8px 16px;cursor:pointer}a{color:#13788a}</style>
<script>window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',splashScreen:false,contextMenu:'off',backgroundColor:'#dbf3fb',warnOnUnsupportedContent:false,logLevel:'warn'}};</script><script src="ruffle/ruffle.js"></script></head>
<body><main id="game" aria-label="Game Ayo Membaca untuk kelas 1 SD"></main><p>Ayo Membaca! · Pembuat program: Rio Christi &nbsp; <button id="full">Layar penuh</button></p>
<script>
window.ayoSimpanCSV=(filename,content)=>{
 const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));
 const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);return true;
};
window.addEventListener('DOMContentLoaded',async()=>{
 const ruffle=window.RufflePlayer.newest();const player=ruffle.createPlayer();window.gamePlayer=player;
 document.querySelector('#game').appendChild(player);
 const qa=new URLSearchParams(location.search).get('qa')==='1';
 await player.ruffle().load({url:'../AyoMembaca.swf',base:'../',parameters:qa?{qa:'1'}:{},allowScriptAccess:true});
 document.querySelector('#full').onclick=()=>document.querySelector('#game').requestFullscreen?.();
});
</script></body></html>
